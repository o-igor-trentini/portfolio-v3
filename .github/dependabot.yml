version: 2
updates:
  # npm dependencies — grouped so minor/patch bumps arrive as one PR per week.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # GitHub Actions used by the CI/deploy workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
