name: CI

# Gate pull requests (and pushes to non-main branches) with the same quality
# checks the deploy workflow runs, so problems surface before merge. Deploy stays
# in deploy.yml, which runs only on push to main.
on:
  pull_request:
  push:
    branches-ignore: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build (static export)
        run: npm run build
